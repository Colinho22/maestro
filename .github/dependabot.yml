# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # GitHub Actions are SHA-pinned in .github/workflows/*.yml. Without
  # this ecosystem entry Dependabot would not propose updates and the
  # pins would go stale, which defeats the security argument for
  # pinning in the first place.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      gh-actions:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-deps:
        patterns:
          - "*"
    ignore:
      # manual version increase during dev (mainly AI SDKs)
      - dependency-name: "anthropic"
      - dependency-name: "openai"
      - dependency-name: "mistralai"
      - dependency-name: "google-genai"
      - dependency-name: "crewai"
      - dependency-name: "langgraph"

      # major releases only
      - dependency-name: "pydantic"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
      - dependency-name: "python-dotenv"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"