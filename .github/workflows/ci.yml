name: ci

# Runs ruff (lint + format check) and pytest on PRs targeting main and on
# main pushes. Branch pushes don't trigger the workflow, saving GitHub
# minutes while still gating every PR.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs when new commits land on the same PR; the latest
# diff is the only one worth gating.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs (not tags) so a republished
      # tag can't silently change what runs. The trailing comment tracks
      # the human-readable version Dependabot will compare against when
      # opening update PRs (see .github/dependabot.yml github-actions
      # ecosystem entry).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Don't leave the GITHUB_TOKEN in .git/config after checkout:
          # the CI job doesn't push, tag, or otherwise need git auth from
          # later steps. Removes needless attack surface if any subsequent
          # step (e.g. a third-party action) reads the workspace.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          # Match the .python-version pin and pyproject.toml requires-python.
          python-version: "3.11"
          cache: pip

      - name: Install project + dev extras
        # Editable install so pytest's pythonpath = ["src"] picks up the
        # package without needing site-packages indirection.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: pytest
        run: pytest -v
